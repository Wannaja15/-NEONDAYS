
name: NEON DAYS - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build NEON DAYS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            wget unzip zip curl ca-certificates python3

      - name: Install Android Command Line Tools
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Prepare Android debug keystore
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          test -s "$HOME/.android/debug.keystore"

      - name: Install Godot 4.3
        run: |
          set -e

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo install \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Install Godot Export Templates
        run: |
          set -e

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz \
            -d /tmp/godot-templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Locate NEON DAYS project
        run: |
          set -e

          PROJECT_ZIP=""

          for FILE in \
            "NEON_DAYS_v0.4_android_ready.zip" \
            "NEON_DAYS_v0.3_camera_pov.zip"
          do
            if [ -f "$FILE" ]; then
              PROJECT_ZIP="$FILE"
              break
            fi
          done

          if [ -z "$PROJECT_ZIP" ]; then
            echo "::error::NEON DAYS project ZIP not found in repository root."
            exit 1
          fi

          echo "PROJECT_ZIP=$PROJECT_ZIP" >> "$GITHUB_ENV"
          echo "Using project archive: $PROJECT_ZIP"

      - name: Extract NEON DAYS project
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/source" \
            -name project.godot -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found inside archive."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Repair Android export preset
        run: |
          set -e

          PRESET="$PROJECT_DIR/export_presets.cfg"
          test -f "$PRESET"

          PRESET_PATH="$PRESET" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PRESET_PATH"])
          lines = path.read_text(encoding="utf-8").splitlines()

          android_index = None

          for i, line in enumerate(lines):
              match = re.fullmatch(r"\[preset\.(\d+)\]", line.strip())
              if not match:
                  continue

              j = i + 1
              while j < len(lines) and not lines[j].strip().startswith("["):
                  if re.fullmatch(r'\s*name\s*=\s*"Android"\s*', lines[j]):
                      android_index = match.group(1)
                      break
                  j += 1

              if android_index is not None:
                  break

          if android_index is None:
              raise SystemExit("Android export preset not found.")

          section = f"[preset.{android_index}.options]"

          try:
              start = lines.index(section)
          except ValueError:
              raise SystemExit("Android options section not found.")

          end = start + 1
          while end < len(lines) and not lines[end].strip().startswith("["):
              end += 1

          options = lines[start + 1:end]
          repaired = []

          for line in options:
              key = line.split("=", 1)[0].strip()

              if key == "gradle_build/use_gradle_build":
                  continue

              if re.search(r"(min_sdk|target_sdk)", key):
                  continue

              repaired.append(line)

          repaired.append("gradle_build/use_gradle_build=false")

          lines = lines[:start + 1] + repaired + lines[end:]

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Android preset repaired.")
          print("Gradle Build disabled.")
          print("Gradle-only SDK overrides removed.")
          PY

      - name: Validate Android preset
        run: |
          set -e

          PRESET="$PROJECT_DIR/export_presets.cfg"

          PRESET_PATH="$PRESET" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path(os.environ["PRESET_PATH"]).read_text(
              encoding="utf-8"
          )

          lines = text.splitlines()
          android_index = None

          for i, line in enumerate(lines):
              match = re.fullmatch(r"\[preset\.(\d+)\]", line.strip())
              if not match:
                  continue

              j = i + 1
              while j < len(lines) and not lines[j].strip().startswith("["):
                  if re.fullmatch(r'\s*name\s*=\s*"Android"\s*', lines[j]):
                      android_index = match.group(1)
                      break
                  j += 1

              if android_index is not None:
                  break

          if android_index is None:
              raise SystemExit("Android preset missing.")

          section = f"[preset.{android_index}.options]"
          start = lines.index(section)

          end = start + 1
          while end < len(lines) and not lines[end].strip().startswith("["):
              end += 1

          options = lines[start + 1:end]

          if "gradle_build/use_gradle_build=false" not in options:
              raise SystemExit("Gradle Build is not disabled.")

          for line in options:
              key = line.split("=", 1)[0].strip()
              if re.search(r"(min_sdk|target_sdk)", key):
                  raise SystemExit("Gradle-only SDK override remains.")

          print("Android preset validation passed.")
          PY

          test -f "$PROJECT_DIR/project.godot"

      - name: Import Godot project
        run: |
          set -e

          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Test project startup
        run: |
          set -e

          godot --headless \
            --path "$PROJECT_DIR" \
            --quit-after 5

      - name: Export NEON DAYS APK
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

          test -s "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

      - name: Verify APK
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

          test -s "$APK"
          unzip -t "$APK"

          unzip -l "$APK" | grep -q "AndroidManifest.xml"

          echo "APK archive verification passed."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DAYS-Android-APK
          path: build/NEON_DAYS.apk
          if-no-files-found: error
          retention-days: 14

