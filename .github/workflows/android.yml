
name: Build NEON DAYS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.3.stable/

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q NEON_DAYS_v0.3_camera_pov.zip -d source
          PROJECT_FILE=$(find source -name project.godot -print -quit)
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Check Android preset
        run: |
          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Import project
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DAYS-Android-APK
          path: build/NEON_DAYS.apk
          if-no-files-found: error
