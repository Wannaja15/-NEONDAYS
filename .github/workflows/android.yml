
name: NEON DAYS - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build NEON DAYS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_NDK_VERSION: "23.2.8568313"
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install required Linux tools
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            zip \
            curl \
            ca-certificates

      # 4. Install Android command-line tools manually
      - name: Install Android SDK Command Line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          sdkmanager --version

      # 5. Install SDK, build tools and NDK
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      # 6. Download Godot 4.3
      - name: Install Godot 4.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo install \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      # 7. Install matching export templates
      - name: Install Godot export templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p /tmp/godot-templates

          unzip -q /tmp/godot-templates.tpz \
            -d /tmp/godot-templates

          test -d /tmp/godot-templates/templates

          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      # 8. Find and extract project ZIP
      - name: Extract NEON DAYS project
        run: |
          PROJECT_ZIP=""

          for FILE in \
            "NEON_DAYS_v0.4_android_ready.zip" \
            "NEON_DAYS_v0.3_camera_pov.zip"
          do
            if [ -f "$FILE" ]; then
              PROJECT_ZIP="$FILE"
              break
            fi
          done

          if [ -z "$PROJECT_ZIP" ]; then
            echo "Searching for project ZIP..."
            PROJECT_ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          fi

          if [ -z "$PROJECT_ZIP" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          echo "Using project: $PROJECT_ZIP"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/source" \
            -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 9. Validate project configuration
      - name: Validate project configuration
        run: |
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"

          grep -q '4.3' "$PROJECT_DIR/project.godot"

          grep -q 'name="Android"' \
            "$PROJECT_DIR/export_presets.cfg"

          echo "Project configuration checks passed."

      # 10. Validate Android preset
      - name: Validate Android export preset
        run: |
          grep -q 'platform="Android"' \
            "$PROJECT_DIR/export_presets.cfg"

          grep -q 'package/unique_name=' \
            "$PROJECT_DIR/export_presets.cfg"

          echo "Android preset found."

      # 11. Import project resources
      - name: Import Godot project
        run: |
          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      # 12. Test project startup
      - name: Test project startup
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --quit-after 5

      # 13. Export Android APK
      - name: Export NEON DAYS APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

          test -s "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

      # 14. Verify APK
      - name: Verify APK
        run: |
          unzip -t "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

          echo "APK file verification passed."

      # 15. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DAYS-Android-APK
          path: build/NEON_DAYS.apk
          if-no-files-found: error
          retention-days: 14
