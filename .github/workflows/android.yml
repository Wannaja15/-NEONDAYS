
name: Build NEON DAYS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEON DAYS project
        run: |
          test -f NEON_DAYS_v0.3_camera_pov.zip
          mkdir -p source
          unzip -q NEON_DAYS_v0.3_camera_pov.zip -d source

      - name: Locate Godot project
        run: |
          PROJECT_FILE=$(find source -name project.godot -print -quit)
          test -n "$PROJECT_FILE"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Check Android export preset
        run: |
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "::error::Android export preset is missing. Add export_presets.cfg from Godot Editor."
            exit 1
          fi

      - name: Import project
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DAYS-Android-APK
          path: build/NEON_DAYS.apk
          if-no-files-found: error
          retention-days: 14
