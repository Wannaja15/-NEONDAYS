
name: NEON DAYS - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build NEON DAYS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip curl ca-certificates

      - name: Install Android Command Line Tools
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found."
            exit 1
          fi

          "$SDKMANAGER" --version

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Install Godot 4.3
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo install \
            /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Install Godot Export Templates
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz

          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Locate NEON DAYS project
        run: |
          PROJECT_ZIP=""

          for FILE in \
            "NEON_DAYS_v0.4_android_ready.zip" \
            "NEON_DAYS_v0.3_camera_pov.zip"
          do
            if [ -f "$FILE" ]; then
              PROJECT_ZIP="$FILE"
              break
            fi
          done

          if [ -z "$PROJECT_ZIP" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          echo "PROJECT_ZIP=$PROJECT_ZIP" >> "$GITHUB_ENV"

      - name: Extract NEON DAYS project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$PROJECT_ZIP" -d "$GITHUB_WORKSPACE/source"

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/source" \
            -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate project
        run: |
          set -e

          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"

          grep -q 'name="Android"' "$PROJECT_DIR/export_presets.cfg"
          grep -q 'platform="Android"' "$PROJECT_DIR/export_presets.cfg"

          echo "Project and Android preset found."

      - name: Import Godot project
        run: |
          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Test project startup
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --quit-after 5

      - name: Export NEON DAYS APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

          test -s "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

      - name: Verify APK
        run: |
          unzip -t "$GITHUB_WORKSPACE/build/NEON_DAYS.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DAYS-Android-APK
          path: build/NEON_DAYS.apk
          if-no-files-found: error
          retention-days: 14
